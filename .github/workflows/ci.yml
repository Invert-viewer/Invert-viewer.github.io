name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # 自动缓存 pnpm store（key 基于 pnpm-lock.yaml）
          cache: pnpm

      - name: Install dependencies
        run: |
          sudo snap install lychee
          pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm run build

      - name: Run lint
        run: pnpm run lint

      - name: Run type/content check
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check for broken links
        run: pnpm run check-links

      - name: Run E2E smoke tests
        run: pnpm run e2e:smoke

      - name: Run E2E critical
        id: e2e_critical
        run: pnpm run e2e:critical

      - name: Run E2E regression
        id: e2e_regression
        if: always()
        run: pnpm run e2e:regression

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
