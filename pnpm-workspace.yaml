# pnpm 配置：允许这些依赖执行 postinstall 构建脚本（下载/编译二进制）
# 对应原 bun 的 trustedDependencies 语义；pnpm 11 使用 allowBuilds 格式
allowBuilds:
  cn-font-split: true
  esbuild: true
  koffi: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# 版本对齐：迁移前 bun.lock 锁定 vite 8.1.3 / rolldown 1.1.x。
# pnpm 全新解析会拿到 vite 8.2.x / rolldown 1.2.x（后者在 Windows 处理虚拟模块时崩溃）
overrides:
  "vite@^8": 8.1.3
