# pnpm 配置：允许这些依赖执行 postinstall 构建脚本（下载/编译二进制）
# 对应原 bun 的 trustedDependencies 语义；pnpm 11 使用 allowBuilds 格式
allowBuilds:
  # cn-font-split 是 vite-plugin-font 的运行时依赖（字体子集化），需执行 build 脚本
  cn-font-split: true
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
  # workerd：wrangler 的核心运行时二进制（CF 部署用）。未放行时 pnpm 11 拒绝其
  # postinstall 下载二进制 → wrangler 启动即崩（CF 部署踩过：ERR_PNPM_IGNORED_BUILDS）
  workerd: true

minimumReleaseAgeExclude:
  - nyx-player-solid@0.1.0 || 0.1.1 || 0.1.2 || 0.1.3 || 0.1.4 || 0.1.5

# 版本对齐迁移前 bun.lock 基线（P2 教训：pnpm 全新解析的传递依赖漂移会引入行为差异）：
# - vite 8.1.3：rolldown 1.2.x 在 Windows 处理虚拟模块时崩溃
# - rolldown 1.1.4：1.1.5 起 vite 8.1.3 对 \0 前缀虚拟模块的 resolveId/load 匹配语义变化，
#   导致 @hyacine/astro 0.0.3 的 virtual:hyacine/runtime 构建期 UNLOADABLE（CI 从 P2 起失败）
overrides:
  "vite@^8": 8.1.3
  "rolldown": 1.1.4
  # Dependabot 安全修复（2026-08）：跨 minor/major 抬升无破坏风险的点位
  # - deepmerge-ts 7.1.5 -> 8.0.2（@playform/inline 精确 pin；CVE-2026-40345 需 >=8.0.0）
  # - uuid 8.3.1 -> 11.1.1（@lhci/cli ^8.x；CVE-2026-41907 需 >=11.1.1；v4 API 兼容）
  # - ip 1.1.9 -> 2.0.1（pac-resolver ^1.1.8；CVE-2024-29415 SSRF 分类；API 兼容）
  "deepmerge-ts@7.1.5": "8.0.2"
  "uuid@^8.3.1": "11.1.1"
  "ip@^1.1.8": "2.0.1"
