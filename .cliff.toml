# git-cliff 配置文件
# 文档: https://git-cliff.org/docs/configuration

[changelog]
# 变更日志头部
header = """
# 📝 Changelog

本文件由 [git-cliff](https://git-cliff.org) 根据 Conventional Commits 自动生成。
"""

# 变更日志主体模板（Tera 模板引擎）
# 注意：通过 group 名中的 "<!-- n -->" 序号前缀控制分组展示顺序
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**破坏性变更**] {% endif %}\
            {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}
"""
# 去除 body 首尾空白（配合模板缩进使用）
trim = true
# 即使没有可处理的版本也渲染 body（本地 --unreleased 预览时用到）
render_always = true

# 变更日志尾部：版本对比链接
footer = """
{% for release in releases %}\
{% if release.version %}\
{% if release.previous.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
{% endif %}\
{% else %}\
[unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..HEAD
{% endif %}\
{% endfor %}

<!-- generated by git-cliff -->
"""

[git]
# 解析 Conventional Commits（feat:/fix:/chore: 等）
conventional_commits = true
# 过滤掉不符合 conventional 规范的提交（如 merge 提交、纯 Revert 等）
filter_unconventional = true
# 版本标签匹配正则（仅匹配 v1.0.0 形式的标签）
tag_pattern = "v[0-9].*"
# 组内提交按时间倒序（最新在前）
sort_commits = "newest"

# 提交分组规则：按 type 归类到不同小标题。
# group 中的 "<!-- n -->" 前缀仅用于控制展示顺序，渲染时会通过 striptags 去除。
commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->✨ 新功能" },
  { message = "^fix", group = "<!-- 01 -->🐛 修复" },
  { message = "^perf", group = "<!-- 02 -->⚡ 性能优化" },
  { message = "^refactor", group = "<!-- 03 -->♻️ 重构" },
  { message = "^style", group = "<!-- 04 -->💄 样式" },
  { message = "^docs", group = "<!-- 05 -->📝 文档" },
  { message = "^test", group = "<!-- 06 -->✅ 测试" },
  { message = "^build", group = "<!-- 07 -->📦 构建" },
  { message = "^ci", group = "<!-- 08 -->👷 CI" },
  { message = "^revert", group = "<!-- 09 -->⏪ 回滚" },
  # 注意：commit_parsers 首个匹配即生效，skip 规则必须排在更宽的 ^chore 规则之前
  { message = "^chore: *v?[0-9]+[.][0-9]+[.][0-9]+", skip = true },
  { message = "^chore", group = "<!-- 10 -->🔧 杂项" },
  { message = ".*", group = "<!-- 11 -->🔖 其他" },
]
